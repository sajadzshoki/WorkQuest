services:
  app:
    image: node:22
    container_name: workquest-app
    working_dir: /app
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        npm install --include=dev
        npx prisma generate
        npx prisma migrate deploy
        npm run build
        exec npm start
    ports:
      - '${APP_HOST_PORT:-3009}:3000'
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: '3000'
      NODE_ENV: production
    volumes:
      - .:/app
      - workquest_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - main
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: workquest-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - workquest_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - default
    restart: unless-stopped

volumes:
  workquest_postgres_data:
    name: workquest_postgres_data
  workquest_node_modules:
    name: workquest_node_modules

networks:
  main:
    external: true
    name: main
