services:
  postgres:
    image: postgres:17-alpine
    container_name: workquest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: workquest
      POSTGRES_PASSWORD: workquest
      POSTGRES_DB: workquest
    ports:
      - '5432:5432'
    volumes:
      - workquest-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U workquest -d workquest']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  workquest-pgdata:
